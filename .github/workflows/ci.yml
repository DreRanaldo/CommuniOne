name: CI

# Runs on every pull request and on pushes to main. Pushes to claude/**
# branches also run so automated work is verified before a PR is opened.
#
# CI never talks to a hosted Supabase project: every database is created
# from scratch inside the runner, and the only keys used are the local
# development keys that `supabase start` generates for that throwaway stack.
# No repository secrets are needed or read.
on:
  pull_request:
  push:
    branches: [main, 'claude/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint, typecheck, unit tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (JS/shell syntax, shellcheck, secret scan)
        run: npm run lint
      - name: Typecheck (service layer strict, scripts and tests)
        run: npm run typecheck
      - name: Unit tests (service-layer core)
        run: npm run test:unit
      - name: Build (compile the service layer to dist/)
        run: npm run build

  database-plain:
    name: Migrations + pgTAP + concurrency (plain PostgreSQL 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PGHOST: /var/run/postgresql
    steps:
      - uses: actions/checkout@v4
      - name: Install pgTAP and pg_prove
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-16-pgtap libtap-parser-sourcehandler-pgtap-perl
      - name: Start a throwaway PostgreSQL cluster
        run: |
          sudo systemctl start postgresql.service
          until pg_isready -q; do sleep 1; done
          sudo -u postgres createuser --superuser "$USER"
      - name: Apply every migration to a clean database and run pgTAP
        run: bash scripts/db/test.sh
      - name: Invitation redemption race test
        run: bash scripts/db/invitation-race.sh
      - name: RSVP capacity stress test
        run: bash scripts/db/rsvp-stress.sh 16 100
      - name: Marketplace checkout and payment stress test (no overselling)
        run: bash scripts/db/checkout-stress.sh 32

  supabase:
    name: Supabase stack (migrations, schema lint, pgTAP, integration)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start local Supabase (applies every migration to a clean database)
        run: npm run db:start
      - name: Build verification - migrations rebuild cleanly from scratch
        run: npm run db:reset
      - name: Schema lint (plpgsql_check)
        run: npm run db:lint
      - name: Generated database types are up to date
        run: |
          npm run db:types
          git diff --exit-code -- services/database.types.ts
      - name: Database tests (pgTAP on real Supabase)
        run: npm run test:db
      - name: Integration tests (Auth + Data API + Storage, and the service layer end to end)
        run: npm run test:integration
      - name: Stop Supabase
        if: always()
        run: npm run db:stop -- --no-backup

  mobile:
    name: Mobile app (lint, format, typecheck, tests, config, doctor, production export)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - name: Lint (ESLint, zero warnings)
        run: npm run lint
      - name: Formatting (Prettier)
        run: npm run format:check
      - name: Typecheck (app + shared services)
        run: npm run typecheck
      - name: Tests (Jest + React Native Testing Library)
        run: npm run test:ci
      - name: Expo config for every variant (ids, scheme, no secrets)
        run: npm run config:check
      - name: Expo doctor (dependency and config health)
        run: npm run doctor
      - name: Production export (Android + iOS bundles, secret checks)
        run: npm run export:check
