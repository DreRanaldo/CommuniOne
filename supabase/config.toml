# Minimal Supabase CLI configuration. Unspecified settings use CLI defaults.
# Run `supabase start`, then `supabase db reset` (applies migrations + seed)
# and `supabase test db` (runs supabase/tests/database/*.test.sql).
project_id = "communione"

[db]
# Match your hosted project (Settings > Infrastructure). The schema needs 15+.
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

# ---------------------------------------------------------------------------
# Authentication (Supabase Auth). See docs/architecture/authentication.md.
#
# This file configures the LOCAL stack. Hosted projects are configured in the
# dashboard; see docs/deployment/supabase-auth.md for the required values and
# `supabase config diff` to compare them with this file.
# Secrets (SMTP passwords, OAuth client secrets) must use env(...) and must
# never be committed.
# ---------------------------------------------------------------------------
[auth]
enabled = true
# Base URL for links in auth emails and the default post-auth redirect.
site_url = "http://127.0.0.1:3000"
# Exact URLs that auth flows may redirect to: the Expo app's deep link and
# the future admin web app's callback. Anything else is rejected.
additional_redirect_urls = [
  "communione://auth/callback",
  "communione://auth/reset-password",
  "http://127.0.0.1:3000/auth/callback",
  "http://localhost:3000/auth/callback",
]
# Access tokens live 1 hour. Revocation does NOT wait for expiry: the
# database requires every token's session to still exist (migration 8).
jwt_expiry = 3600
# Each refresh token is single-use; reuse outside the short grace window
# revokes the whole session family (stolen-token detection).
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# Anonymous users would receive the `authenticated` role. Disabled here AND
# rejected by private.current_session_user_id() as defence in depth.
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.rate_limit]
# Local/test defaults; production limits are set in the dashboard (see
# docs/deployment/supabase-auth.md). Emails go to the local Mailpit only, and
# the test suites send several confirmation and reset emails per run.
email_sent = 100
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30

[auth.email]
enable_signup = true
# Users must confirm their email before they can sign in (locally the
# emails are captured by Mailpit at http://127.0.0.1:54324).
enable_confirmations = true
double_confirm_changes = true
# Changing the password requires a recent sign-in or reauthentication.
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
# Phone sign-in is not part of the MVP.
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"

# Absolute / idle session limits (hosted: Pro plan). Expired sessions are
# rejected by the database via auth.sessions.not_after.
# [auth.sessions]
# timebox = "720h"
# inactivity_timeout = "168h"

# External OAuth providers (Google, Apple, ...) are not enabled yet. When
# added, reference secrets via env(), e.g.:
# [auth.external.google]
# enabled = true
# client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
# secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"

# ---------------------------------------------------------------------------
# Storage (documents). See docs/features/documents.md.
# The 'documents' bucket itself (private, 50 MiB ceiling, MIME allow-list) is
# created by migration 20261011001600_documents.sql so every environment gets
# the same configuration; the application limit is in
# public.document_upload_settings.
# ---------------------------------------------------------------------------
[storage]
enabled = true
file_size_limit = "50MiB"

# Payments Edge Functions (docs/commerce/payments.md). The webhook and the
# test checkout page authenticate by signature, not by user JWT; the
# reconcile function checks the service-role bearer itself.
[functions.payments-session]
verify_jwt = true

[functions.payments-webhook]
verify_jwt = false

[functions.payments-reconcile]
verify_jwt = false

[functions.payments-test-checkout]
verify_jwt = false

[functions.refunds-process]
verify_jwt = false
